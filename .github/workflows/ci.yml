name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: chessannotator
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess_dev_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U chess -d chessannotator"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Alembic upgrade
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5434
        run: alembic upgrade head
      - name: Alembic check (модели == миграции)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5434
        run: alembic check
      - name: Alembic roundtrip (downgrade base → upgrade head)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5434
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Pytest
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5434
          REDIS_URL: redis://127.0.0.1:6380/0
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t chessannotator:ci .
