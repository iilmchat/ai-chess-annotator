services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ENV: prod
      # Внутри compose-сети сервисы доступны по именам, а не по 127.0.0.1.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-chessannotator}
      POSTGRES_USER: ${POSTGRES_USER:-chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess_dev_password}
      REDIS_URL: redis://redis:6379/0
      STOCKFISH_PATH: /usr/bin/stockfish
      # LM Studio на хосте (если используется локальная LLM). Не берём
      # VLLM_BASE_URL из dev-.env: там 127.0.0.1 указывает на контейнер.
      VLLM_BASE_URL: ${PROD_VLLM_BASE_URL:-http://host.docker.internal:8034/v1}
      CORS_ORIGINS: ${PROD_CORS_ORIGINS:-http://127.0.0.1:8000}
      WORKERS: ${WORKERS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Наружу смотрит только reverse-proxy; API — на loopback.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000
             --workers $${WORKERS:-1}"

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chessannotator}
      POSTGRES_USER: ${POSTGRES_USER:-chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess_dev_password}
    ports:
      # Только loopback: БД не доступна из внешней сети.
      - "127.0.0.1:${PROD_POSTGRES_PORT:-5434}:5432"
    volumes:
      - prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chess} -d ${POSTGRES_DB:-chessannotator}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Только loopback: Redis не доступен из внешней сети.
      - "127.0.0.1:${PROD_REDIS_PORT:-6380}:6379"
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  prod_pg_data:
  prod_redis_data:
