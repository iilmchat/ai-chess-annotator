[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-annotator"
version = "0.1.0"
description = "AI Commentary Engine for chess games (beginner / club / gm levels)"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [{ name = "RuChating (iilmchat)" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-chess>=1.999",
    "stockfish>=3.28",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "arq>=0.26",
    "structlog>=24.4",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    # T-028/KI-036: JWT-аутентификация и Argon2id.
    # Argon2id — основной KDF (рекомендация OWASP, DESIGN_ADMIN_AND_OPS §4.1).
    "argon2-cffi>=23.1",
    # bcrypt оставлен ТОЛЬКО для проверки legacy-хешей, созданных
    # passlib[bcrypt] в итерации 24: при успешном входе хеш мигрирует в
    # Argon2id (см. app/auth/passwords.py). После конвертации всех хешей
    # зависимость можно удалить.
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.2",
    "sse-starlette>=2.1",
    "starlette-admin>=1.0",
    "itsdangerous>=2.2",
    # ZoneInfo на Windows не имеет системной базы часовых поясов, а
    # starlette-admin конвертирует datetime в TZ пользователя.
    "tzdata>=2024.1",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
    # Стабы для mypy --strict (python-jose); argon2-cffi и bcrypt
    # поставляют типы сами (py.typed).
    "types-python-jose>=3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]
# RUF001/RUF002/RUF003 — «ambiguous unicode» в строках и докстрингах:
# документация, сообщения об ошибках и комментарии проекта на русском,
# кириллица в них ожидаема (латинские похожие буквы в коде — отдельная тема,
# её ловит ревью, а не линтер).
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["stockfish.*", "chess.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"