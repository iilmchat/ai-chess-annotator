# Prometheus: скрейпит два endpoint-а OTel Collector.
#   * :8889 — OTLP-метрики приложения (llm_calls_total, llm_tokens_total,
#     llm_cost_usd_total, llm_latency_milliseconds_*);
#   * :8890 — spanmetrics из трейсов (traces_span_metrics_calls_total,
#     traces_span_metrics_duration_milliseconds_bucket) с labels
#     http_route/http_response_status_code.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector-llm-metrics
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector-span-metrics
    static_configs:
      - targets: ["otel-collector:8890"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
