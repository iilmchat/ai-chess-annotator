name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: chessannotator
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess_dev_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U chess -d chessannotator"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install Stockfish
        # libcairo2 — системная зависимость cairosvg: диаграмма доски в PDF
        # (T-107b) проверяется в CI на реальном рендерере.
        run: sudo apt-get update && sudo apt-get install -y stockfish libcairo2
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Alembic upgrade
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5434
        run: alembic upgrade head
      - name: Alembic check (модели == миграции)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5434
        run: alembic check
      - name: Alembic roundtrip (downgrade base → upgrade head)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5434
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Pytest
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5434
          REDIS_URL: redis://127.0.0.1:6380/0
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright E2E (mocked API)
        run: pnpm exec playwright test
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t chessannotator:ci .
      - name: Smoke import production image
        # KI-051: wheel содержит только app; любой import app -> scripts
        # уронит uvicorn. Проверяем импорт без инфраструктуры.
        run: docker run --rm chessannotator:ci python -c "import app.main"

  # T-027: публикация образа в GHCR только по тегу v* (release).
  # На обычных push/PR job пропускается; права packages: write выданы
  # только этому job-у, а не всему workflow.
  publish-docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/iilmchat/ai-chess-annotator
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ChessAnnotator
            org.opencontainers.image.description=AI chess commentary engine
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Тот же build-arg, что и в Dockerfile: пусто = same-origin SPA.
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
