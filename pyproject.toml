[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-annotator"
version = "1.1.0"
description = "AI Commentary Engine for chess games (beginner / club / gm levels)"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [{ name = "RuChating (iilmchat)" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-chess>=1.999",
    "stockfish>=3.28",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "arq>=0.26",
    "structlog>=24.4",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    # T-028/KI-036: JWT-аутентификация и Argon2id.
    # Argon2id — основной KDF (рекомендация OWASP, DESIGN_ADMIN_AND_OPS §4.1).
    "argon2-cffi>=23.1",
    # bcrypt оставлен ТОЛЬКО для проверки legacy-хешей, созданных
    # passlib[bcrypt] в итерации 24: при успешном входе хеш мигрирует в
    # Argon2id (см. app/auth/passwords.py). После конвертации всех хешей
    # зависимость можно удалить.
    "bcrypt>=4.1",
    # T-110 (итерация 34): PyJWT вместо python-jose. Причина — аудит
    # зависимостей: python-jose 3.5.0 (PYSEC-2026-4298) и его транзитивный
    # python-ecdsa (PYSEC-2026-1325) не имеют исправленных версий; нам нужен
    # только HS256, для которого PyJWT достаточно и не тянет ecdsa.
    "PyJWT>=2.8",
    "email-validator>=2.2",
    "sse-starlette>=2.1",
    "starlette-admin>=1.0",
    "itsdangerous>=2.2",
    # ZoneInfo на Windows не имеет системной базы часовых поясов, а
    # starlette-admin конвертирует datetime в TZ пользователя.
    "tzdata>=2024.1",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    # T-107: PDF-экспорт комментария. fpdf2 — чистый Python (без GTK/cairo,
    # в отличие от weasyprint): работает в Docker/CI и на Windows; кириллица
    # через TrueType-шрифт (см. app/export/pdf.py).
    "fpdf2>=2.8",
    # T-107b: SVG-диаграмма доски → PNG для вставки в PDF. cairosvg —
    # чистый Python, но использует нативную cairo (libcairo2 в Docker/CI);
    # без неё PDF собирается без картинки (app.export.board).
    "cairosvg>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
    # T-110: python-jose удалён (PYSEC-2026-4298 + ecdsa
    # PYSEC-2026-1325); PyJWT поставляет собственные type hints.
    # T-107: проверка PDF в тестах (извлечение текста из сгенерированного файла).
    "pypdf>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]
# RUF001/RUF002/RUF003 — «ambiguous unicode» в строках и докстрингах:
# документация, сообщения об ошибках и комментарии проекта на русском,
# кириллица в них ожидаема (латинские похожие буквы в коде — отдельная тема,
# её ловит ревью, а не линтер).
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["stockfish.*", "chess.*", "cairosvg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"