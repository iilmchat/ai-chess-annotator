services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chessannotator}
      POSTGRES_USER: ${POSTGRES_USER:-chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess_dev_password}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chess} -d ${POSTGRES_DB:-chessannotator}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Хостовый порт переопределяется REDIS_PORT (по умолчанию 6380).
      # См. KI-001: на dev-машине 6380 может быть занят другим проектом.
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Опционально: изолированный Stockfish как UCI-over-TCP.
  # Backend по умолчанию использует локальный бинарник.
  stockfish:
    profiles: ["engine"]
    build:
      context: ./docker/stockfish
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"

  # Опционально: локальная LLM для уровня «новичок»/«клуб».
  vllm:
    profiles: ["llm-local"]
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3-8B}
      --host 0.0.0.0 --port 8000
      --max-model-len 8192
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pg_data:
  redis_data:
  vllm_cache: